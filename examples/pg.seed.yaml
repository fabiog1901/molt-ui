# dbworkload v0.16 seed definition for order_demo.sql.
# Originally generated using dbworkload.utils.common.ddl_to_yaml, then adapted
# for PostgreSQL datatypes, constraints, relationships and realistic sampling.
#
# From examples/postgres (the existing importer references 4-worker filenames):
#   dbworkload util csv --input order_demo.seed.yaml --output order_demo --procs 4 --csv-max-rows 100000
# Counts are defined below, not inferred from the DDL. Target tables must be empty.
# Table keys use dbworkload's schema__table convention. Load in YAML table order,
# including all three order_items batches. CSV/TSV files have no header.
# Use PostgreSQL COPY with explicit column lists, FORMAT csv, tab delimiter,
# and NULL ''. Reset identity sequences after loading (see import_order_demo.sql).
# Computed search_document, total and line_total columns are omitted.
# Orders are routed through the parent to its 16 hash partitions.
# audit.audit_event is not seeded; dimension UPDATE triggers populate it.
#
# Sampling dependencies (keep population order/length, seeds and weights aligned):
# - Customers.full_name and addresses.recipient share seed 103 and row counts.
# - Address city/region/postal_code/country_code/coordinates share seed 203.
# - Orders.customer_id and shipping_address_id use matching integer generators.
# - All order/payment/shipment timeline choices share seed 901 (32 profiles).
# - All item quantities/prices/discounts, order totals and payment amounts
#   share seed 902 (32 profiles); counts/workers must match across these tables.
# - Shipping snapshots sample historical addresses independently of current ones.
# - sort-by stays empty to preserve generated row relationships.
# Changing process count changes sampled values and filenames; use the same
# process count for every table, and update import paths if it changes.
# Constants are deliberate: completed/captured lifecycle, one default address,
# NULL category parents and fixed item line numbers preserve baseline semantics.
# This YAML only generates files. CLI IMPORT INTO output targets CockroachDB;
# use the PostgreSQL loader instead.
#
